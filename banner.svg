<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Animated Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A;#1E1B4B;#022C22;#0F172A" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1E1B4B">
        <animate attributeName="stop-color" values="#1E1B4B;#022C22;#0F172A;#1E1B4B" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Bright Animated Text Gradient (Your original) -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#9333EA;#FACC15;#38BDF8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9333EA">
        <animate attributeName="stop-color" values="#9333EA;#FACC15;#38BDF8;#9333EA" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Apply Background Gradient Here -->
  <rect width="800" height="200" fill="url(#bg-grad)"/>
  
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
        font-family="Fira Code" font-size="48" font-weight="bold" fill="url(#text-grad)">
    Cue-designs
  </text>
</svg>
